services:
  # python:
  #   image: python:3.12
  #   container_name: python3-12
  #   working_dir: /src
  #   volumes:
  #     - .:/src
  #   # command: sh -c "pip install -r requirements.txt"
  #   command: sh -c "apt-get update && pip install -r src/requirements.txt && playwright install --with-deps chromium && tail -f /dev/null"


  celery_worker:
    build:
      dockerfile: Dockerfile
    container_name: celery_worker
    command: celery -A src.src.celery_config.celery_app worker --loglevel=info

  db_writer:
    build:
      dockerfile: Dockerfile
    container_name: db_writer
    command: python src/src/db/write.py

  kafka-service:
    image: apache/kafka:3.7.0
    container_name: kafka-service
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-service:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka-service/data

  redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - '6380:6380'
    volumes:
      - redis-data:/data
        # environment:
        #     - REDIS_ARGS=--requirepass your_password_here --appendonly yes
    restart: unless-stopped


  db:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: moja_baza
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data


volumes:
    kafka-data:
    redis-data:
        driver: local

